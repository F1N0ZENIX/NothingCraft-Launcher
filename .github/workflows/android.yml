name: Build NothingCraft Launcher

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nothingcraft-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout NothingCraft build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Build actual Minecraft Java launcher from pinned upstream
        run: bash scripts/build-nothingcraft.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NothingCraft-Launcher-1.0.2-arm64
          path: "dist/NothingCraft Launcher 1.0.2.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: NothingCraft Launcher 1.0.2
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: "dist/NothingCraft Launcher 1.0.2.apk"
