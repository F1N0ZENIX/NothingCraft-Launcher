name: Build NothingCraft Launcher and Snapdragon Mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nothingcraft-release-1-0-5
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout NothingCraft build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Android launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Build NothingCraft Launcher APK
        run: bash scripts/build-nothingcraft.sh

      - name: Set up JDK 25 for Minecraft 26.3 Fabric mod
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build NothingCraft Snapdragon Optimizer Fabric mod
        run: bash scripts/build-snapdragon-mod.sh

      - name: Upload APK and mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NothingCraft-1.0.4-and-Snapdragon-Mod
          path: |
            dist/NothingCraft Launcher 1.0.5.apk
            dist/NothingCraft-Snapdragon-Optimizer-1.0.1.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: NothingCraft Launcher 1.0.5
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/NothingCraft Launcher 1.0.5.apk
            dist/NothingCraft-Snapdragon-Optimizer-1.0.1.jar
