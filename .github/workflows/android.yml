name: Android CI
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Select Gradle command
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        run: $GRADLE_CMD --no-daemon assembleDebug
      - name: Name debug APK with app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)"
          if [ -z "$VERSION_NAME" ]; then echo "Could not read versionName from app/build.gradle"; exit 1; fi
          cp app/build/outputs/apk/debug/app-debug.apk "NothingCraft Launcher ${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NothingCraft-Launcher
          path: "NothingCraft Launcher *.apk"
          if-no-files-found: error
          retention-days: 14
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: $GRADLE_CMD --no-daemon assembleRelease
      - name: Check release signing configuration
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare signing key
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nothingcraft-release.jks"
      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/nothingcraft-release.jks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "NothingCraft Launcher ${VERSION_NAME}.apk" app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Create installable debug-signed fallback
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured != 'true'
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)"
          cp app/build/outputs/apk/debug/app-debug.apk "NothingCraft Launcher ${VERSION_NAME}.apk"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "NothingCraft Launcher ${{ github.ref_name }}"
          generate_release_notes: true
          files: "NothingCraft Launcher *.apk"
