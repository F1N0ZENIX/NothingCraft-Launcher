name: Android CI and automatic release
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Select Gradle command
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(awk -F"'" '/versionName/ {print $2; exit}' app/build.gradle)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: $GRADLE_CMD --no-daemon assembleDebug assembleRelease

      - name: Name and sign APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "NothingCraft Launcher $VERSION_NAME-debug.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nothingcraft-release.jks"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/nothingcraft-release.jks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "NothingCraft Launcher $VERSION_NAME.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          else
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "NothingCraft Launcher $VERSION_NAME.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "NothingCraft Launcher $VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NothingCraft-Launcher-debug
          path: "NothingCraft Launcher *-debug.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.name }}"
          name: "NothingCraft Launcher ${{ steps.version.outputs.name }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: "NothingCraft Launcher ${{ steps.version.outputs.name }}.apk"
